name: Customer API integration
on:
  push:
    branches: [feature/customer-app-api]
  pull_request:
    paths: ['src/**', 'shared/**', 'tests/**', '.github/workflows/customer-integration.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name qist-test-mongo -p 27017:27017 mongo:8.0 --replSet qist-test --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec qist-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec qist-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"qist-test",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec qist-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Typecheck, lint and all integration tests
        run: bun run check
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=qist-test&directConnection=true
          MONGODB_DB: qist_ci
